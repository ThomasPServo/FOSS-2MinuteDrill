# Rebuilds web/data from the latest nflverse releases and the public Next Gen Stats API,
# then opens a pull request with the new data so a person reviews it before it ships.
name: Refresh data

on:
  schedule:
    - cron: "17 9 * 9-12,1-2 3"   # Wednesdays during the season, after nflverse's Tuesday updates
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      # Past seasons' Next Gen Stats responses never change: keep them between runs so a
      # refresh only asks the NGS API for the weeks played since the last one.
      - uses: actions/cache@v4
        with:
          path: .cache/ngs
          key: ngs-${{ github.run_id }}
          restore-keys: ngs-
      - name: Build data
        run: python -m pipeline.build --out web/data
      - name: Validate the data contract
        run: python -m pytest -q tests/python
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Engine tests against the new data
        run: npm test
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: data-refresh
          commit-message: Refresh game data from nflverse and Next Gen Stats
          title: Refresh game data
          body: Automated rebuild of `web/data` by the Refresh data workflow.
